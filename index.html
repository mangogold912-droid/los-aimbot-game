<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Brawl Stars - Ultimate Colt</title>
    <!-- 3D 엔진 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 모바일 가상 조이스틱 Nipple.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Arial', sans-serif; user-select: none; }
        #canvas-container { position: absolute; width: 100%; height: 100%; }
        #ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        
        .btn { position: absolute; background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; pointer-events: auto; text-shadow: 1px 1px 2px black; cursor: pointer;}
        .btn:active { transform: scale(0.9); }
        
        #joy-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 100%; pointer-events: auto; }
        
        /* 우측 하단 스킬 버튼들 */
        #btn-fire { right: 30px; bottom: 30px; width: 90px; height: 90px; background: rgba(255, 0, 0, 0.6); font-size: 18px; }
        #btn-super { right: 140px; bottom: 30px; width: 70px; height: 70px; background: rgba(255, 200, 0, 0.6); }
        #btn-hyper { right: 30px; bottom: 140px; width: 70px; height: 70px; background: rgba(200, 0, 255, 0.6); }
        #btn-gadget { right: 120px; bottom: 120px; width: 60px; height: 60px; background: rgba(0, 255, 0, 0.6); font-size: 12px; text-align: center;}
        
        /* 미러 스트레이핑(LoS) 제어 버튼 (중앙 하단) */
        #btn-in { left: 50%; bottom: 30px; transform: translateX(-120%); width: 70px; height: 70px; display: none; background: rgba(255, 165, 0, 0.6); }
        #btn-out { left: 50%; bottom: 30px; transform: translateX(20%); width: 70px; height: 70px; display: none; background: rgba(255, 165, 0, 0.6); }
        #btn-cancel { left: 50%; bottom: 120px; transform: translateX(-50%); width: 100px; height: 40px; border-radius: 10px; display: none; background: rgba(255, 0, 0, 0.6); }
        
        /* 상단 상태 및 토글 */
        .top-bar { position: absolute; top: 15px; pointer-events: auto; background: rgba(0, 255, 255, 0.3); padding: 8px 15px; border: 1px solid cyan; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #toggle-sp { left: 15px; }
        #toggle-gd { left: 220px; }
        
        #stats-ui { position: absolute; left: 15px; top: 60px; color: yellow; text-shadow: 1px 1px 2px black; font-size: 16px; pointer-events: none; line-height: 1.5; }
        #aimbot-status { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); color: lime; text-shadow: 1px 1px 2px black; font-size: 20px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="joy-zone"></div>
    
    <div id="ui-layer">
        <div id="toggle-sp" class="top-bar">SP: Slick Boots</div>
        <div id="toggle-gd" class="top-bar">GD: Speedloader</div>
        
        <div id="stats-ui">
            Ammo: <span id="ammo-val">3</span><br>
            Super: <span id="super-val">0/12</span><br>
            Hyper: <span id="hyper-val">0/35</span>
        </div>
        <div id="aimbot-status">MIRROR STRAFING ACTIVE</div>
        
        <div id="btn-fire" class="btn">FIRE</div>
        <div id="btn-super" class="btn">SUPER</div>
        <div id="btn-hyper" class="btn">HYPER</div>
        <div id="btn-gadget" class="btn">GADGET (3)</div>
        
        <div id="btn-in" class="btn">IN</div>
        <div id="btn-out" class="btn">OUT</div>
        <div id="btn-cancel" class="btn">CANCEL LoS</div>
    </div>

    <script>
        // --- 1. Three.js 3D 씬 설정 (브롤스타즈 뷰) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // 브롤스타즈 식 Orthographic(직교) 카메라
        const aspect = window.innerWidth / window.innerHeight;
        const d = 60;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(0, 100, 70); // 위에서 비스듬히 내려다보는 앵글
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 조명
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x606060));

        // 바닥 맵
        const planeGeo = new THREE.PlaneGeometry(400, 400);
        const planeMat = new THREE.MeshLambertMaterial({ color: 0x4d3319 }); // 흙바닥 색
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // 그리드 헬퍼
        const grid = new THREE.GridHelper(400, 40, 0x000000, 0x000000);
        grid.position.y = 0.1;
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // --- 2. 게임 오브젝트 클래스 ---
        const bullets = [];
        
        class Player {
            constructor() {
                this.mesh = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 8, 16), new THREE.MeshLambertMaterial({ color: 0x3399ff }));
                this.mesh.position.set(0, 4, 20);
                scene.add(this.mesh);
                
                // 콜트 스탯 (2026 Meta)
                this.baseSpeed = 0.8;
                this.bulletSpeed = 3.5;
                this.baseDamage = 720;
                
                this.ammo = 3.0;
                this.reloadTimer = 0;
                this.reloadMax = 78; // 약 1.3초
                
                this.superCharge = 0;
                this.hcCharge = 0;
                this.hcActive = false;
                this.hcTimer = 0;
                
                this.sp = "Slick Boots";
                this.gadget = "Speedloader";
                this.gadgetUses = 3;
                this.silverActive = false;
                this.sbBuffieTimer = 0; // 스피드부츠 적중 버피
                
                this.bursting = false;
                this.burstType = "normal";
                this.burstCount = 0;
                this.burstTimer = 0;
                
                this.mirrorStrafing = false;
                this.targetDist = 0;
                this.losVector = new THREE.Vector3();
            }

            getStats() {
                let s = this.baseSpeed;
                let bs = this.bulletSpeed;
                let dmg = 1.0;
                if (this.hcActive) { s *= 1.2; dmg *= 1.05; }
                if (this.sp === "Slick Boots") { s *= 1.13; if (this.sbBuffieTimer > 0) s *= 1.15; }
                else if (this.sp === "Magnum Special") { bs *= 1.11; }
                return { s, bs, dmg };
            }
        }

        class EnemyDummy {
            constructor() {
                this.mesh = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 8, 16), new THREE.MeshLambertMaterial({ color: 0xff3333 }));
                this.mesh.position.set(0, 4, -20);
                scene.add(this.mesh);
                
                this.hp = 10000;
                this.speed = 0.5;
                this.targetPos = new THREE.Vector3(0, 4, -20);
                this.velocity = new THREE.Vector3();
            }

            update() {
                // 스마트 랜덤 무빙
                if (this.mesh.position.distanceTo(this.targetPos) < 2) {
                    this.targetPos.set((Math.random() - 0.5) * 100, 4, (Math.random() - 0.5) * 100);
                }
                const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position).normalize();
                this.velocity.copy(dir).multiplyScalar(this.speed);
                this.mesh.position.add(this.velocity);
            }
        }

        const player = new Player();
        const enemy = new EnemyDummy();

        // 에임봇 수학: 3차원 2차 방정식 기반 예측 사격
        function getPredictiveAimDir(pPos, ePos, eV, bSpeed) {
            const dx = ePos.x - pPos.x;
            const dz = ePos.z - pPos.z;
            const a = (eV.x * eV.x + eV.z * eV.z) - (bSpeed * bSpeed);
            const b = 2 * (dx * eV.x + dz * eV.z);
            const c = dx * dx + dz * dz;
            let t = -1;

            if (Math.abs(a) < 0.0001) {
                if (b !== 0) t = -c / b;
            } else {
                const desc = b * b - 4 * a * c;
                if (desc >= 0) {
                    const t1 = (-b - Math.sqrt(desc)) / (2 * a);
                    const t2 = (-b + Math.sqrt(desc)) / (2 * a);
                    if (t1 > 0 && t2 > 0) t = Math.min(t1, t2);
                    else if (t1 > 0) t = t1;
                    else if (t2 > 0) t = t2;
                }
            }

            if (t <= 0) {
                return new THREE.Vector3(dx, 0, dz).normalize();
            }

            const targetX = ePos.x + eV.x * t;
            const targetZ = ePos.z + eV.z * t;
            return new THREE.Vector3(targetX - pPos.x, 0, targetZ - pPos.z).normalize();
        }

        // --- 3. 입력 제어 (조이스틱 & UI) ---
        const joyVec = new THREE.Vector3();
        let btnIn = false, btnOut = false;

        const manager = nipplejs.create({ zone: document.getElementById('joy-zone'), mode: 'dynamic', color: 'white' });
        manager.on('move', (evt, data) => { joyVec.set(data.vector.x, 0, -data.vector.y); });
        manager.on('end', () => { joyVec.set(0, 0, 0); });

        const uiElements = {
            in: document.getElementById('btn-in'), out: document.getElementById('btn-out'), cancel: document.getElementById('btn-cancel'),
            fire: document.getElementById('btn-fire'), super: document.getElementById('btn-super'), hyper: document.getElementById('btn-hyper'),
            gadget: document.getElementById('btn-gadget'), aimStatus: document.getElementById('aimbot-status')
        };

        // 버튼 이벤트
        uiElements.fire.ontouchstart = uiElements.fire.onmousedown = () => {
            if (!player.bursting && player.ammo >= 1) {
                player.bursting = true;
                player.burstType = player.silverActive ? "silver" : "normal";
                player.ammo -= 1;
                player.burstCount = 0; player.burstTimer = 0;
            }
        };
        uiElements.super.ontouchstart = uiElements.super.onmousedown = () => {
            if (!player.bursting && player.superCharge >= 12) {
                player.bursting = true; player.burstType = "super";
                player.superCharge = 0; player.burstCount = 0; player.burstTimer = 0;
            }
        };
        uiElements.hyper.ontouchstart = uiElements.hyper.onmousedown = () => {
            if (player.hcCharge >= 35) { player.hcActive = true; player.hcCharge = 0; player.hcTimer = 60 * 7; }
        };
        uiElements.gadget.ontouchstart = uiElements.gadget.onmousedown = () => {
            if (player.gadgetUses > 0) {
                player.gadgetUses--;
                if (player.gadget === "Speedloader") player.ammo = Math.min(3, player.ammo + 2);
                else if (player.gadget === "Silver Bullet") player.silverActive = true;
                uiElements.gadget.innerText = `GADGET (${player.gadgetUses})`;
            }
        };
        
        document.getElementById('toggle-sp').onclick = (e) => {
            player.sp = player.sp === "Slick Boots" ? "Magnum Special" : "Slick Boots";
            e.target.innerText = "SP: " + player.sp;
        };
        document.getElementById('toggle-gd').onclick = (e) => {
            player.gadget = player.gadget === "Speedloader" ? "Silver Bullet" : "Speedloader";
            e.target.innerText = "GD: " + player.gadget;
        };

        // 거리 조절 버튼
        const setBtnState = (btn, state) => { btn.ontouchstart = btn.onmousedown = () => state(true); btn.ontouchend = btn.onmouseup = () => state(false); };
        setBtnState(uiElements.in, v => btnIn = v);
        setBtnState(uiElements.out, v => btnOut = v);
        uiElements.cancel.ontouchstart = uiElements.cancel.onmousedown = () => { player.mirrorStrafing = false; };

        // --- 4. 메인 게임 루프 ---
        function updateUI() {
            document.getElementById('ammo-val').innerText = Math.floor(player.ammo);
            document.getElementById('super-val').innerText = `${player.superCharge}/12`;
            document.getElementById('hyper-val').innerText = `${player.hcCharge}/35`;
            
            uiElements.super.style.opacity = player.superCharge >= 12 ? "1" : "0.3";
            uiElements.hyper.style.opacity = player.hcCharge >= 35 ? "1" : "0.3";
            uiElements.fire.style.background = player.silverActive ? "rgba(192,192,192,0.8)" : "rgba(255,0,0,0.6)";
            uiElements.fire.innerText = player.silverActive ? "SILVER" : "FIRE";
            
            if (player.mirrorStrafing) {
                uiElements.in.style.display = "flex"; uiElements.out.style.display = "flex"; uiElements.cancel.style.display = "flex";
                uiElements.fire.style.display = "none"; uiElements.super.style.display = "none"; uiElements.hyper.style.display = "none"; uiElements.gadget.style.display = "none";
                uiElements.aimStatus.style.display = "block";
            } else {
                uiElements.in.style.display = "none"; uiElements.out.style.display = "none"; uiElements.cancel.style.display = "none";
                uiElements.fire.style.display = "flex"; uiElements.super.style.display = "flex"; uiElements.hyper.style.display = "flex"; uiElements.gadget.style.display = "flex";
                uiElements.aimStatus.style.display = "none";
            }
        }

        const auraGeo = new THREE.TorusGeometry(3.5, 0.2, 16, 100);
        const auraMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const hcAura = new THREE.Mesh(auraGeo, auraMat);
        hcAura.rotation.x = Math.PI / 2;
        scene.add(hcAura);

        // 시야선(LoS) 렌더링
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
        const lineGeo = new THREE.BufferGeometry();
        const losLine = new THREE.Line(lineGeo, lineMat);
        scene.add(losLine);

        function animate() {
            requestAnimationFrame(animate);
            const stats = player.getStats();

            if (player.sbBuffieTimer > 0) player.sbBuffieTimer--;
            if (player.hcActive) {
                player.hcTimer--;
                if (player.hcTimer <= 0) player.hcActive = false;
                hcAura.position.copy(player.mesh.position);
                hcAura.position.y = 1;
                hcAura.visible = true;
            } else {
                hcAura.visible = false;
            }

            // 이동 처리
            if (player.mirrorStrafing) {
                if (btnIn) player.targetDist = Math.max(10, player.targetDist - stats.s);
                if (btnOut) player.targetDist = Math.min(150, player.targetDist + stats.s);
                
                player.mesh.position.x = enemy.mesh.position.x + player.losVector.x * player.targetDist;
                player.mesh.position.z = enemy.mesh.position.z + player.losVector.z * player.targetDist;
                
                losLine.visible = true;
                lineGeo.setFromPoints([enemy.mesh.position, player.mesh.position]);
            } else {
                losLine.visible = false;
                player.mesh.position.addScaledVector(joyVec, stats.s);
            }

            // 카메라 추적
            camera.position.x = player.mesh.position.x;
            camera.position.z = player.mesh.position.z + 70;
            camera.lookAt(player.mesh.position);

            enemy.update();

            // 장전
            if (player.ammo < 3 && !player.bursting) {
                player.reloadTimer--;
                if (player.reloadTimer <= 0) {
                    player.ammo = Math.min(3, player.ammo + 1);
                    player.reloadTimer = player.hcActive ? player.reloadMax * 1.1 : player.reloadMax;
                }
            }

            // 사격 발사 (Aimbot)
            if (player.bursting) {
                player.burstTimer--;
                if (player.burstTimer <= 0) {
                    const dir = getPredictiveAimDir(player.mesh.position, enemy.mesh.position, enemy.velocity, stats.bs);
                    
                    let bColor = 0xffffff, size = 1, dmg = player.baseDamage * stats.dmg, pierce = false;
                    
                    if (player.burstType === "silver") {
                        bColor = 0xc0c0c0; size = 3; dmg = 2100 * stats.dmg; pierce = true;
                        player.silverActive = false; player.bursting = false;
                    } else if (player.burstType === "super") {
                        bColor = 0xffc800; size = player.hcActive ? 2.5 : 1.5; dmg = 640 * stats.dmg; pierce = true;
                        player.burstCount++; player.burstTimer = 2;
                        if (player.burstCount >= 12) player.bursting = false;
                    } else {
                        player.burstCount++; player.burstTimer = player.hcActive ? 2 : 4; // 버피: 언로드 속도 2배
                        if (player.burstCount >= 6) player.bursting = false;
                    }

                    const bMesh = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 8), new THREE.MeshBasicMaterial({ color: bColor }));
                    bMesh.position.copy(player.mesh.position);
                    scene.add(bMesh);
                    bullets.push({ mesh: bMesh, dir: dir, speed: stats.bs, dmg: dmg, pierce: pierce, hit: false });
                }
            }

            // 총알 이동 및 충돌
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);
                
                // 적 충돌 검사
                if (!b.hit && b.mesh.position.distanceTo(enemy.mesh.position) < 3 + b.mesh.geometry.parameters.radius) {
                    b.hit = true;
                    
                    // 버피 계산
                    let finalDmg = b.dmg;
                    const dist = player.mesh.position.distanceTo(enemy.mesh.position);
                    if (player.sp === "Magnum Special" && dist > 40) finalDmg *= 1.2;
                    if (player.sp === "Slick Boots") player.sbBuffieTimer = 60;
                    if (player.gadget === "Speedloader") player.ammo = Math.min(3, player.ammo + 0.5); // 장전기 버피
                    
                    enemy.hp -= finalDmg;
                    if (enemy.hp <= 0) { enemy.hp = 10000; }
                    
                    player.superCharge = Math.min(12, player.superCharge + 1);
                    if (!player.hcActive) player.hcCharge = Math.min(35, player.hcCharge + 1);
                    
                    // 미러 스트레이핑 축 고정
                    if (!player.mirrorStrafing) {
                        player.mirrorStrafing = true;
                        player.losVector.subVectors(player.mesh.position, enemy.mesh.position).normalize();
                        player.targetDist = dist;
                    }

                    if (!b.pierce) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        continue;
                    }
                }
                
                // 화면 밖 제거
                if (b.mesh.position.distanceTo(player.mesh.position) > 200) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            updateUI();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
